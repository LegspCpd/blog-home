name: Build Check

# 每次推送 main 与 PR 都必须构建通过。
# 上一代 workflow 监听的是 master（仓库实际用 main），等于从未生效——
# 这就是构建连续坏掉却没人发现的原因。这里监听真实分支。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不声明 version —— action 会读 package.json 的 packageManager 字段。
      # 两处同时声明会直接报 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4

      # 必须 >= 22.12.0，与 package.json 的 engines 保持一致
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec astro build

      # ---- 设计令牌必须真的注入到 HTML ----
      # 背景：令牌内联在 <head> 的 <style>:root{} 里，是首屏配色的唯一来源。
      # 如果这一步静默失败（变量名改了、designVars 返回空、style 被摇掉），
      # 构建依然全绿，但页面会变成一块没有配色的白底 —— 只看构建结果发现不了。
      - name: Verify design tokens are inlined
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # 1. 关键令牌必须存在，且值不能是空的或未解析的 var()
          for v in --c-base --c-s1 --c-ink --c-body --c-muted \
                   --c-neon-volt --r-md --s-lg --m-quick; do
            grep -q -- "$v:" dist/index.html \
              || fail "design token $v not inlined into dist/index.html"
          done

          # 2. 至少要有一个真实色值（#rrggbb），否则说明注入的是变量名而不是值
          grep -Eq -- '--c-base:#[0-9a-fA-F]{6}' dist/index.html \
            || fail "no literal color value inlined -- tokens may be unresolved"

          # 3. 字体必须自托管成功，否则会退回系统字体、字距全变
          [ -f dist/fonts/inter-latin.woff2 ] || fail "Inter woff2 missing from dist"
          grep -q 'inter-latin.woff2' dist/fonts/fonts.css \
            || fail "fonts.css does not reference the downloaded woff2"

          echo "OK: design tokens inlined with literal values, font self-hosted"

      # ---- 无障碍：对比度 / 语义结构 / 跳过导航链接 ----
      - name: Accessibility
        run: node scripts/a11y-check.mjs

      # ---- 结构化数据：JSON-LD 语法 + 文章页必须有 BlogPosting ----
      - name: Structured data
        run: node scripts/check-structured-data.mjs

      # ---- sitemap 可达性：格式对但指向 404 同样是负信号 ----
      - name: Sitemap links resolve
        run: node scripts/check-sitemap-links.mjs

      # ---- SEO 断言：构建通过不等于产物正确 ----
      - name: Verify sitemap + RSS + domain
        run: |
          set -euo pipefail
          SITE="https://legspcpd.asia"
          fail() { echo "::error::$1"; exit 1; }

          [ -f dist/sitemap-index.xml ] || fail "sitemap-index.xml missing"
          [ -f dist/sitemap-0.xml ]     || fail "sitemap-0.xml missing"
          [ -f dist/rss.xml ]           || fail "rss.xml missing"
          [ -f dist/robots.txt ]        || fail "robots.txt missing"

          # 全站不允许出现旧域名
          if grep -rl "blog\.legspcpd\.top" dist/ ; then
            fail "old domain blog.legspcpd.top found in build output"
          fi

          # sitemap 的每一条 loc 必须是新域名（逐条列出，不用 head 截断）
          BAD=$(grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml \
                | grep -v "$SITE" || true)
          [ -z "$BAD" ] || fail "sitemap contains wrong-domain URLs: $BAD"

          # 文章必须带 lastmod（内容新鲜度信号）
          # 注意：sitemap 是单行 XML，必须用 grep -o | wc -l 数"出现次数"，
          # 用 grep -c 数的是"匹配行数"，单行文件永远返回 1 —— 那是假绿。
          POSTS=$(grep -o '<loc>[^<]*/posts/[^<]*</loc>' dist/sitemap-0.xml | wc -l)
          LASTMOD=$(grep -o '<lastmod>' dist/sitemap-0.xml | wc -l)
          [ "$POSTS" -gt 0 ] || fail "no post URLs in sitemap"
          [ "$POSTS" -ge 10 ] || fail "expected 16 posts, got $POSTS"
          [ "$LASTMOD" -ge "$POSTS" ] \
            || fail "only $LASTMOD lastmod for $POSTS posts"

          # RSS 必须有条目且指向新域名
          ITEMS=$(grep -o '<item>' dist/rss.xml | wc -l)
          [ "$ITEMS" -gt 0 ] || fail "rss.xml has no items"
          [ "$ITEMS" -eq "$POSTS" ] \
            || fail "rss items ($ITEMS) != post count ($POSTS)"
          grep -q "$SITE" dist/rss.xml || fail "rss.xml missing site domain"

          # robots 必须声明 sitemap
          grep -q "Sitemap: $SITE/sitemap-index.xml" dist/robots.txt \
            || fail "robots.txt Sitemap line wrong"

          echo "OK: posts=$POSTS lastmod=$LASTMOD rss_items=$ITEMS"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
